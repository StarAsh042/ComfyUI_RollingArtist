name: CI

# 在 PR 与推送到主分支时跑测试与静态检查。
# 原仓库只有发布流程（publish.yml），测试全靠本地手动执行，
# 这里补上 CI 门禁，避免带着失败测试或明显 lint 错误合并。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 pyproject 声明的最低版本与当前主流版本
        python-version: ["3.8", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          # 路径防护有 Windows 特有分支（扩展前缀 / ADS），必须覆盖
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
